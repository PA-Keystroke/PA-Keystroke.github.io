name: Supabase keepalive

on:
  push:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_touch:
        description: "Refresh the activity marker even if it is fresh"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        shell: bash
        run: |
          set -euo pipefail
          url=$(sed -n 's/.*url: "\([^"]*\)".*/\1/p' assets/supabase-config.js | head -n1)
          key=$(sed -n 's/.*anonKey: "\([^"]*\)".*/\1/p' assets/supabase-config.js | head -n1)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Could not read Supabase config from assets/supabase-config.js" >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/keepalive-response -w '%{http_code}' --max-time 30 \
            "$url/rest/v1/preset_packages?select=id&limit=1" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key")
          echo "HTTP $status"
          cat /tmp/keepalive-response
          if [ "$status" != "200" ]; then
            echo "Supabase keepalive failed with HTTP $status" >&2
            exit 1
          fi

      # Public repositories disable scheduled workflows after 60 days without
      # repository activity. Touch a marker every 30 days to keep this alive.
      - name: Keep scheduled workflow enabled
        shell: bash
        env:
          FORCE_TOUCH: ${{ inputs.force_touch }}
        run: |
          set -euo pipefail
          marker=".github/keepalive.txt"
          now=$(date -u +%s)
          last=$(date -u -d "$(cat "$marker" 2>/dev/null || echo 1970-01-01T00:00:00Z)" +%s)
          if [ "$FORCE_TOUCH" != "true" ] && [ $(( (now - last) / 86400 )) -lt 30 ]; then
            echo "Repository activity marker is fresh."
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "chore: keep Supabase keepalive workflow active"
          git push
